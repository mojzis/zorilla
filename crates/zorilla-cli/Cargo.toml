[package]
name = "zorilla-cli"
version = "0.2.0"
description = "CLI for zorilla — pytest test-smell linter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zorilla"
path = "src/main.rs"

[dependencies]
zorilla-core = { path = "../zorilla-core", features = ["clap"] }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.release]
pre-release-replacements = [
  { file = "../../docs/guide/setup.md", search = "rev: v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "rev: v{{version}}" },
  { file = "../../README.md", search = "rev: v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "rev: v{{version}}" },
]
