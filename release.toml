# cargo-release configuration
# Usage: cargo release patch|minor|major

# Create a git tag for the release
tag = true
tag-message = "Release {{version}}"

# Commit message for the version bump
pre-release-commit-message = "Release v{{version}}"

# Push the commit and tag to the remote
push = true

# Don't try to publish to crates.io (we distribute via Python/maturin)
publish = false

# Run pre-release checks
verify = true

# The pre-commit `rev:` pin is copy-pasted verbatim by readers, so it has to move
# with the version. `docs/guide/setup.md` is additionally test-enforced
# (`guide::tests::setup_pins_the_current_release`), which would fail CI on the
# release commit itself if the bump were left to a human.
pre-release-replacements = [
  { file = "docs/guide/setup.md", search = "rev: v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "rev: v{{version}}" },
  { file = "README.md", search = "rev: v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "rev: v{{version}}" },
]
